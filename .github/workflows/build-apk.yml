name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Prepare APK for Release
        id: prep
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          APK_NAME="CleanCut-v${VERSION}.apk"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$APK_NAME"
          fi
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanCut-APK
          path: ${{ steps.prep.outputs.apk_path }}
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          name: CleanCut v${{ steps.prep.outputs.version }}
          body: |
            Реліз CleanCut v${{ steps.prep.outputs.version }}:
            - Оптимізація продуктивності Jetpack Compose (Compose Performance):
              • Відкладене зчитування стану жесту до фази Draw замість рекомпозиції контейнера на кожен рух пальця (гарантія 60/120 FPS).
              • Використання `derivedStateOf` для жестів масштабування та панорамування в редакторі маски та області перегляду.
              • Кешування об'єктів `Paint` та усунення зайвих алокацій у фазі Draw для `CheckerboardBackground`.
              • Усунення повторних алокацій списків пресетів кольорів у `BackgroundSelector` та перехід на апаратний GPU `graphicsLayer`.
            - Покращення архітектури (Clean Architecture & Compose State):
              • Розділення `MainScreen` на контролер екрана та чистий, доступний для тестування `MainContent`.
              • Плавні безшовні переходи між станами інтерфейсу за допомогою `AnimatedContent`.
              • Дотримання принципу Single Responsibility: виокремлено `CheckModelReadyUseCase`, `DownloadModelUseCase`, `CheckForUpdateUseCase`, `DownloadApkUseCase`, `InstallApkUseCase`.
              • Впровадження інверсії залежностей (Constructor Injection) у `MainViewModel` без прямої прив'язки до реалізацій шару Data.
              • Очищення методів ViewModel від прямої передачі Android `Context`.
            - Надійність та розширення тестів (TDD):
              • Додано модульні тести для доменних UseCases.
          files: ${{ steps.prep.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
