name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        id: prep
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          APK_NAME="CleanCut-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanCut-APK
          path: ${{ steps.prep.outputs.apk_path }}
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          name: CleanCut v${{ steps.prep.outputs.version }}
          body: |
            Реліз CleanCut v${{ steps.prep.outputs.version }}:
            - Повне приведення пайплайну BiRefNet до офіційного стандарту rembg та BiRefNet (ZhengPeng7):
              • Впроваджено обов'язкове динамічне масштабування Min-Max `(pred - mi) / (ma - mi)` після сигмоїди.
              • Усунуто паразитну залишкову непрозорість (0.04-0.06 alpha), яка залишала туман на фоні та спотворювала край об'єкта.
              • Фонове поле тепер гарантовано скидається в абсолютний 0.0.
            - Покращення стабільності MatteDefringer:
              • Додано Corner Sampling fallback для безпомилкового виявлення кольору фону навіть на складних масках.
              • Повне узгодження роботи Choke та Color Dilation із каліброваною маскою BiRefNet.
          files: ${{ steps.prep.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
