name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        id: prep
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          APK_NAME="CleanCut-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanCut-APK
          path: ${{ steps.prep.outputs.apk_path }}
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          name: CleanCut v${{ steps.prep.outputs.version }}
          body: |
            Реліз CleanCut v${{ steps.prep.outputs.version }}:
            - Напівпрозора маска відсіченого (Rubylith / Ghost Overlay):
              • Перемикання режимів оверлею безпосередньо у верхній панелі (Шахівниця, Рубін, Привид) з візуальним бейджем статусу.
              • Чітка візуалізація стертих ділянок оригінального фото для легкого та точного відновлення контурів без додаткового оверхеду пам'яті.
            - Розумне заповнення до меж (Smart Boundary Flood Fill / Заливка):
              • Новий інструмент «Заливка» на базі високоефективного скануючого алгоритму Heckbert Scanline Span Seed Fill.
              • Враховує колірну дистанцію CompuPhase та градієнтні бар'єри Scharr для стирання або відновлення однорідних зон в один дотик.
              • Налаштування чутливості (толерантності) та швидкий вибір режиму (Стерти / Відновити).
            - Розумна кисть з прив'язкою до меж (Smart Edge-Aware Brush):
              • Інтелектуальний фільтр «Край» для інструментів стирання та відновлення на основі локального Star-Convex BFS.
              • Автоматично зупиняє мазок пензля на контрастних межах об'єкта, запобігаючи випадковому зафарбовуванню фону чи деталей.
            - Повна підтримка історії скасувань (Undo / Redo) для всіх нових інструментів.
          files: ${{ steps.prep.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
