name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        id: prep
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          APK_NAME="CleanCut-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanCut-APK
          path: ${{ steps.prep.outputs.apk_path }}
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          name: CleanCut v${{ steps.prep.outputs.version }}
          body: |
            Реліз CleanCut v${{ steps.prep.outputs.version }}:
            - Оновлено та виправлено режим ручної правки країв (Mask Editor):
              • Повністю перероблено нижню панель інструментів: адаптивні кнопки з рівномірним розподілом простору, що запобігають обрізанню або витісненню тексту на вузьких екранах.
              • Впроваджено нативний двопальцевий жест масштабування та переміщення (Pinch-to-zoom & Pan) з центруванням відносно пальців безпосередньо під час малювання, а також окремий інструмент «Зум».
              • Додано миттєвий живий відгук (Live Feedback) мазків пензля без затримок та сліпого малювання.
              • Впроваджено субпіксельну інтерполяцію мазків для усунення розривів ліній при швидкому русі пальця.
              • Додано кнопку порівняння з оригінальним фото («Око») у верхній панелі для швидкого контролю контурів.
              • Додано захисний діалог підтвердження при спробі виходу з редактора з незбереженими правками.
              • Додано динамічний візуальний індикатор діаметра пензля поруч зі слайдером.
          files: ${{ steps.prep.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
