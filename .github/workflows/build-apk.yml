name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Prepare APK for Release
        id: prep
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          APK_NAME="CleanCut-v${VERSION}.apk"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$APK_NAME"
          fi
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanCut-APK
          path: ${{ steps.prep.outputs.apk_path }}
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          name: CleanCut v${{ steps.prep.outputs.version }}
          body: |
            Реліз CleanCut v${{ steps.prep.outputs.version }}:
            - Виправлення масштабування жестів (Pinch-to-zoom):
              • Тепер масштабування у зоні попереднього перегляду (`ImagePreviewArea`) та редакторі масок відбувається точно від фокальної точки між двома пальцями (центроїда жесту), а не від центру екрана.
              • Створено спеціалізовану утиліту `ZoomTransformCalculator`, що математично зберігає нерухомим вміст безпосередньо під пальцями користувача під час збільшення, зменшення та панорамування.
              • Додано захист від виходу зображення за межі екрана (динамічне обмеження з комфортним запасом для огляду кутів і країв).
            - Тестування (TDD):
              • Додано модульний набір тестів `ZoomTransformCalculatorTest` для перевірки нульового дрейфу фокальної точки, мультикрокового панорамування та скидання масштабу до одиниці.
          files: ${{ steps.prep.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
