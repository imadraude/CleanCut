name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        id: prep
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          APK_NAME="CleanCut-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanCut-APK
          path: ${{ steps.prep.outputs.apk_path }}
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          name: CleanCut v${{ steps.prep.outputs.version }}
          body: |
            Реліз CleanCut v${{ steps.prep.outputs.version }}:
            - Комплексне оновлення UI/UX (Material 3 Expressive):
              • Повністю оновлено палітру теми та підтримку Edge-to-Edge з прозорими системними панелями.
              • Новий презентаційний Hero-блок на головному екрані з бейджами переваг (офлайн, швидкість, точність) та виразною кнопкою вибору фото.
              • Анімований перемикач режимів якості (Segmented Control) з плавними переходами кольорів та контурів.
              • Оновлене полотно попереднього перегляду з плаваючими пігулками контролю масштабу та швидкого перемикання порівняння (Оригінал / Результат).
              • Покращена панель вибору фону з анімованим тактильним вибором та наочною шахівницею прозорого шару.
              • Полішинг кнопок дій (поділитися, зберегти PNG, ручна правка) та діалогів завантаження/оновлення.
              • Повністю очищено проєкт від застарілих рудиментів.
          files: ${{ steps.prep.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
