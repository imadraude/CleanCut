name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Prepare APK for Release
        id: prep
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          APK_NAME="CleanCut-v${VERSION}.apk"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$APK_NAME"
          fi
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanCut-APK
          path: ${{ steps.prep.outputs.apk_path }}
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          name: CleanCut v${{ steps.prep.outputs.version }}
          body: |
            Реліз CleanCut v${{ steps.prep.outputs.version }}:
            - Усунення зворотного просочування кольору фону (Edge Color Decontamination & Defringing):
              • Глибока радіальна дилатація кольору (Color Bleed) до 8 пікселів напівпрозорих країв за стандартами Photoshop і Spine 2D — чистий колір переднього плану поширюється на всю ширину переходу без залишків старого фону.
              • Універсальний адаптивний бордер-чок (Border Alpha Choke) для будь-яких кольорів фону (зелений, синій, темний, градієнтний тощо) замість обмеження лише світлими фонами.
              • Локальне семплювання кольору фону (Local Background Sampling) для точного аналітичного розплутування (Matte Unmixing) на неоднорідних або градієнтних фонах.
              • Повна інтеграція MatteDefringer у FAST-режим ML Kit (раніше використовувався сирий RGB без очищення країв).
              • Розширення інструменту ручного видалення ореолів (DEFRINGE) у редакторі маски MaskRefineEngine для ефективнішої обробки широких контурів.
            - Тестування (TDD):
              • Додано крок запуску модульних тестів у CI перед релізом APK.
              • Додано регресійні тести для очищення просочування кольору на широких межах, неоднорідних фонах та зелених/синіх задніх планах.
          files: ${{ steps.prep.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
